[project]
name = "docfunnel"
version = "0.1.0"
description = "Proof of concept: does parsing PDFs on the CPU (text layer, OCR per page) before an LLM extracts their data pay off? Pipeline, evals and results against real models."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Fialho", email = "guilhermec.fialho@gmail.com" }]
requires-python = ">=3.12"
keywords = ["llm", "document-ai", "ocr", "pdf", "evals", "pydantic", "structured-output", "invoices"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Framework :: FastAPI",
    "Framework :: Pydantic :: 2",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
# Floors are the releases the adapters are tested against: they pass reasoning_effort,
# output_config/thinking (API version 2026-10-21) and thinking_level / response_json_schema.
openai = ["openai>=3.42"]
anthropic = ["anthropic>=2.4"]
gemini = ["google-genai>=2.34"]
providers = ["openai>=3.42", "anthropic>=2.4", "google-genai>=2.34"]
mcp = ["mcp>=1.2"]
pdf = ["pypdfium2>=5.0"]
ocr = ["pypdfium2>=5.0", "rapidocr>=3.0", "onnxruntime>=1.20", "pillow>=10.0"]
tesseract = ["pypdfium2>=5.0", "pytesseract>=0.3.10", "pillow>=10.0"]
synthetic = ["pypdfium2>=5.0", "reportlab>=4.2", "pillow>=10.0", "numpy>=1.26"]
cpu = ["docfunnel[pdf,ocr]"]

[project.scripts]
docfunnel = "docfunnel.cli:app"

[project.urls]
Homepage = "https://github.com/gcfialho/docfunnel"
Documentation = "https://github.com/gcfialho/docfunnel/tree/main/docs"
Repository = "https://github.com/gcfialho/docfunnel"
Issues = "https://github.com/gcfialho/docfunnel/issues"
Changelog = "https://github.com/gcfialho/docfunnel/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pypdf>=6.0", # baseline for the parse throughput benchmark only
    "mypy>=2.4.1",
    "types-reportlab>=5.0.0.20261008",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docfunnel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PT"]
ignore = ["B008"] # typer/fastapi use call expressions in defaults

[tool.ruff.lint.isort]
known-first-party = ["docfunnel"]
known-local-folder = ["helpers"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "tests"  # tests/helpers.py, imported from the test subfolders

[[tool.mypy.overrides]]
# Optional extras that ship neither inline types nor a py.typed marker, and have no stubs.
module = ["pypdfium2", "pypdfium2.*", "pytesseract"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]  # tests/helpers.py, imported from the test subfolders
addopts = "-ra --strict-markers"
markers = ["integration: end-to-end tests through the fake provider"]
