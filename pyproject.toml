[project]
name = "docfunnel"
version = "0.1.0"
description = "Schema-constrained LLM extraction for receipts and invoices, with retries, human-in-the-loop flags and a reproducible evaluation harness."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guilherme Fialho", email = "guilhermec.fialho@gmail.com" }]
requires-python = ">=3.12"
keywords = ["llm", "document-extraction", "evals", "pydantic", "structured-output", "invoices", "receipts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "typer>=0.12",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
openai = ["openai>=1.40"]
anthropic = ["anthropic>=0.40"]
gemini = ["google-genai>=1.0"]
providers = ["openai>=1.40", "anthropic>=0.40", "google-genai>=1.0"]
mcp = ["mcp>=1.2"]
pdf = ["pypdfium2>=5.0"]
ocr = ["pypdfium2>=5.0", "rapidocr>=3.0", "onnxruntime>=1.20", "pillow>=10.0"]
tesseract = ["pypdfium2>=5.0", "pytesseract>=0.3.10", "pillow>=10.0"]
synthetic = ["pypdfium2>=5.0", "reportlab>=4.2", "pillow>=10.0", "numpy>=1.26"]
cpu = ["docfunnel[pdf,ocr]"]

[project.scripts]
docfunnel = "docfunnel.cli:app"

[project.urls]
Repository = "https://github.com/gcfialho/docfunnel"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pypdf>=6.0", # baseline for the parse throughput benchmark only
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docfunnel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "C4", "PT"]
ignore = ["B008"] # typer/fastapi use call expressions in defaults

[tool.ruff.lint.isort]
known-first-party = ["docfunnel"]
known-local-folder = ["helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: end-to-end tests through the fake provider"]
